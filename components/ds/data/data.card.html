<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-bg);font-family:var(--font-sans);}</style>
<div id="root"></div>
<script type="text/babel">
const { Table, Pagination, Calendar, StatusBadge } = window.OBASASECSDesignSystem_66e938;
function Demo() {
  const [page, setPage] = React.useState(2);
  const [pageSize, setPageSize] = React.useState(25);
  const [range, setRange] = React.useState({ start: new Date(2026, 6, 3), end: new Date(2026, 6, 9) });
  return (
    <div style={{display:'flex', gap:16}}>
      <div style={{flex:1, display:'flex', flexDirection:'column', gap:12}}>
        <Table
          columns={[
            {key:'variant', label:'Variante', width:'2fr', sortable:true},
            {key:'price', label:'Prix', width:'1fr'},
            {key:'status', label:'Statut', width:'1fr', render:(r)=><StatusBadge status={r.status} />},
          ]}
          groups={[
            {family:'Fer à béton', variants:[
              {variant:'6mm', price:'3 800 FCFA', status:'en stock'},
              {variant:'8mm', price:'4 500 FCFA', status:'faible'},
            ]},
            {family:'Ciment', variants:[
              {variant:'CEM II 50kg', price:'6 000 FCFA', status:'rupture'},
            ]},
          ]}
          sortKey="variant" sortDir="asc"
        />
        {/* Pagination: table-only control — page size, total, prev/next. No relation to Calendar below. */}
        <Pagination page={page} pageCount={48} onChange={setPage} total={1240} pageSize={pageSize} onPageSizeChange={setPageSize} />
      </div>
      {/* Calendar: standalone date picker — "personnalisée" period uses mode="range". */}
      <Calendar mode="range" range={range} onRangeChange={setRange} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
