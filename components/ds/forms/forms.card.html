<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-sans);}</style>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch, ToggleGroup } = window.OBASASECSDesignSystem_66e938;
function Demo() {
  const [cb, setCb] = React.useState(true);
  const [rd, setRd] = React.useState('cash');
  const [sw, setSw] = React.useState(true);
  const [view, setView] = React.useState('grid');
  return (
    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
      <Input label="Référence produit" defaultValue="REF-00231" hint="Générée automatiquement, modifiable" />
      <Select label="Catégorie" options={[{value:'fer', label:'Fer à béton'},{value:'ciment', label:'Ciment'}]} />
      <div style={{display:'flex', flexDirection:'column', gap:10}}>
        <Checkbox label="Vente anonyme (par défaut)" checked={cb} onChange={e=>setCb(e.target.checked)} />
        <Radio name="mode" label="Espèces" checked={rd==='cash'} onChange={()=>setRd('cash')} />
        <Radio name="mode" label="Mobile Money" checked={rd==='mm'} onChange={()=>setRd('mm')} />
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:10, justifyContent:'center'}}>
        <Switch checked={sw} onChange={e=>setSw(e.target.checked)} label="Notifications" />
        <ToggleGroup options={[{value:'grid', icon:'grid-3x3'},{value:'list', icon:'list'}]} value={view} onChange={setView} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
